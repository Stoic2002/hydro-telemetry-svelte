name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # `bun install` menjalankan script `prepare`, yang memanggil `svelte-kit
      # sync`. Tanpa itu `.svelte-kit/tsconfig.json` dan tipe rute belum ada dan
      # svelte-check langsung gagal.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # typecheck (svelte-check) + lint (prettier & eslint) + test + build.
      # Bundle production ikut terbentuk di sini, jadi artefaknya bisa dinaikkan.
      - name: Run quality gate
        run: bun run check

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-production-${{ github.sha }}
          path: dist
          retention-days: 14
          if-no-files-found: error

  build-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build staging bundle
        run: bun run build:staging

      - name: Upload staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-staging-${{ github.sha }}
          path: dist-staging
          retention-days: 14
          if-no-files-found: error
